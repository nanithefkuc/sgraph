[package]
name = "sgraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Sparse graph: a shared sparse/Tanner-graph engine for erasure codes"
repository = "https://github.com/nanithefkuc/sgraph"
license = "MIT"
readme = "README.md"
keywords = ["ldpc", "fountain", "erasure", "tanner", "peeling"]
categories = ["algorithms", "mathematics", "no-std"]
exclude = ["/.github", "/.plans"]
# Distributed via git only; depends on `fgf` by git.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Pinned by revision, not branch: this crate's neighbour generation and residual
# solve feed downstream wire formats, so a floating dependency is a format-break
# risk. Consumers should pin this revision so cargo resolves one `fgf` copy.
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd" }
# Linear algebra belongs to gfm; sgraph supplies graph-owned row assembly and
# delegates elimination through its rev-pinned public API.
gfm = { git = "https://github.com/nanithefkuc/gfm", rev = "7d269bfc0f4569c0d334526fdd8887eb16af066c" }

[dev-dependencies]
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "graph"
harness = false

[features]
default = ["std", "simd"]
# Standard library. Required for runtime CPU detection and process-wide caches.
std = ["fgf/std", "gfm/std"]
# Runtime-dispatched SIMD kernels; without it, portable scalar.
simd = ["std", "fgf/simd", "gfm/simd"]
# Unstable APIs, exempt from this crate's compatibility guarantees.
internals = []

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
